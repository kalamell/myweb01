name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/wonderful-hypatia-32zxcs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # ให้ลิงก์ตรงเข้าหน้าย่อย (เช่น /about) ทำงานบน GitHub Pages
      - run: cp dist/index.html dist/404.html
      # เผยแพร่ dist/ ไปที่ branch gh-pages ซึ่ง GitHub Pages ใช้เป็นแหล่งเว็บ
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          force_orphan: true
